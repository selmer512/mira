services:
  mira-osint-api:
    build:
      context: ./backend
    container_name: mira-osint-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Mira OSINT API
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=mira_osint_password
      - QDRANT_URL=http://qdrant:6333
      - REDPANDA_BROKERS=redpanda:9092
    depends_on:
      - neo4j
      - qdrant
      - redpanda

  neo4j:
    image: neo4j:5-community
    container_name: mira-osint-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/mira_osint_password
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mira-osint-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: mira-osint-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"

volumes:
  neo4j_data:
  qdrant_data:
