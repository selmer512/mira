name: Greenfield regression validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/greenfield-regression-ci.yml'
      - '.env.sample'
      - 'app/**'
      - 'aurora/**'
      - 'bridges/**'
      - 'package.json'
      - 'scripts/**'
      - 'server/src/**'
      - 'skills/**'
      - 'test/**'
      - 'tsconfig.json'
      - 'vitest.http.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greenfield-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Lint, build, client, agentic, and HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIRA_LANG: en-US
      MIRA_HTTP_API_LANG: en-US
      MIRA_GREENFIELD_ENABLED: 'false'
      MIRA_GREENFIELD_TRACE_PERSISTENCE: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without setup side effects
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Build Aurora type declarations
        run: npm run build --workspace aurora

      - name: Create diagnostic directory
        run: mkdir -p greenfield-regression-output

      - name: Lint greenfield server and owner UI code
        id: greenfield_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx eslint \
            'server/src/core/greenfield/**/*.{ts,js}' \
            'server/src/core/http-server/api/greenfield/**/*.{ts,js}' \
            'server/src/core/http-server/http-server.ts' \
            'server/src/core/http-server/plugins/key.ts' \
            'app/src/js/trace-operations-*.js' \
            --ignore-pattern .gitignore \
            2>&1 | tee greenfield-regression-output/greenfield-lint.log

      - name: Capture repository lint baseline
        id: repository_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx eslint \
            'app/src/js/*.{ts,js}' \
            'scripts/**/*.{ts,js}' \
            'server/src/**/*.{ts,js}' \
            --ignore-pattern .gitignore \
            2>&1 | tee greenfield-regression-output/repository-lint.log

      - name: Build production server
        id: build_server
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:server 2>&1 | tee greenfield-regression-output/build-server.log

      - name: Build production client
        id: build_app
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:app 2>&1 | tee greenfield-regression-output/build-app.log

      - name: Run agentic-loop unit suite
        id: agentic_unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:agentic-loop:unit 2>&1 | tee greenfield-regression-output/agentic-unit.log

      - name: Run current authenticated HTTP suite
        id: over_http
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:over-http 2>&1 | tee greenfield-regression-output/over-http.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenfield-regression-output
          path: greenfield-regression-output
          if-no-files-found: error

      - name: Enforce greenfield regression results
        if: always()
        shell: bash
        run: |
          failed=0
          for result in \
            "greenfield_lint:${{ steps.greenfield_lint.outcome }}" \
            "build_server:${{ steps.build_server.outcome }}" \
            "build_app:${{ steps.build_app.outcome }}" \
            "agentic_unit:${{ steps.agentic_unit.outcome }}" \
            "over_http:${{ steps.over_http.outcome }}"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [[ "$outcome" != 'success' ]]; then
              echo "$name failed; inspect the uploaded diagnostics."
              failed=1
            fi
          done

          if [[ "${{ steps.repository_lint.outcome }}" != 'success' ]]; then
            echo 'Repository-wide lint has a baseline failure; see repository-lint.log.'
          fi

          exit "$failed"
