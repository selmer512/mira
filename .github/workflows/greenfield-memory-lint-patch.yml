name: Greenfield memory lint patch

on:
  push:
    branches:
      - greenfield/vertical-slice-foundation-20260710
    paths:
      - 'scripts/greenfield/apply-memory-lint-fix.mjs'

permissions:
  contents: write

concurrency:
  group: greenfield-memory-lint-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: greenfield/vertical-slice-foundation-20260710
          fetch-depth: 0

      - name: Apply exact lint fixes
        run: node scripts/greenfield/apply-memory-lint-fix.mjs

      - name: Commit exact source corrections
        run: |
          git config user.name 'mira-greenfield-bot'
          git config user.email 'mira-greenfield-bot@users.noreply.github.com'
          git add server/src/core/greenfield/memory-store.ts server/src/core/http-server/api/greenfield/memory.ts
          git add -u .github/workflows/greenfield-memory-lint-patch.yml scripts/greenfield/apply-memory-lint-fix.mjs
          git diff --cached --check
          git commit -m 'fix(memory): satisfy repository lint contracts'
          git push origin HEAD:greenfield/vertical-slice-foundation-20260710
