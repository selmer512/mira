<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#d6dee6" stop-opacity="0.92"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#d6dee6" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c8d2dc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-20%" width="220%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="lineGlow" x="-400%" y="-5%" width="900%" height="110%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#050505"/>
  <!-- Halo -->
  <ellipse cx="50" cy="50" rx="30" ry="42" fill="url(#halo)" filter="url(#softGlow)"/>
  <!-- Orbital ring -->
  <ellipse cx="50" cy="50" rx="33" ry="28" fill="none"
           stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"
           filter="url(#softGlow)"/>
  <!-- Soft glow behind line -->
  <rect x="46" y="11" width="8" height="78" rx="4"
        fill="#b4c3d2" fill-opacity="0.18" filter="url(#softGlow)"/>
  <!-- Main vertical line -->
  <rect x="49" y="11" width="2" height="78" rx="1"
        fill="url(#lineGrad)" filter="url(#lineGlow)"/>
</svg>
